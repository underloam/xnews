      <text x="16" y="42" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#fda4af">searchResearchPapers · CENTRAL_BANK_*</text>
      <line x1="16" y1="49" x2="316" y2="49" stroke="#ffffff" stroke-opacity="0.08"/>
