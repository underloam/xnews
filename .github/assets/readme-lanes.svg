        <text x="16" y="84.5" font-size="12.5" fill="#ffffff" fill-opacity="0.92">FFIEC Call Reports, FR Y-9, NIC, E.16 &amp; Census</text>
        <circle cx="6" cy="102" r="2.5" fill="#fda4af"/>
        <text x="16" y="106.5" font-size="12.5" fill="#ffffff" fill-opacity="0.92">Live quotes, prediction markets &amp; active events</text>
