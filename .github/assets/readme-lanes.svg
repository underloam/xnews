      <stop offset="0" stop-color="#44212a"/>
      <stop offset="0.58" stop-color="#361b22"/>
      <stop offset="1" stop-color="#1d1a1f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="720" height="438" rx="22"/>
    </clipPath>
  </defs>
  <rect width="720" height="438" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
