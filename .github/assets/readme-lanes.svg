<svg width="1200" height="268" viewBox="0 0 1200 268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xnews subpath exports and data lanes</title>
  <desc id="desc">Four ESM subpath entry points and four public-source data lanes: news and filings, research and central banks, economic and world data, and documents and media.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44212a"/>
      <stop offset="0.58" stop-color="#361b22"/>
      <stop offset="1" stop-color="#1d1a1f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="268" rx="26"/>
    </clipPath>
  </defs>
  <rect width="1200" height="268" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <text x="-10" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="260" font-weight="800" fill="#ffffff" opacity="0.025">xnewsxnewsxnewsxnews</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="267" rx="25.5" stroke="#ffffff" stroke-opacity="0.11"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="28" y="32" font-size="12" font-weight="700" fill="#fda4af" letter-spacing="1.4">ESM ENTRY POINTS &amp; FOUR PUBLIC-SOURCE DATA LANES (NODE 24+ · ZERO RUNTIME DEPENDENCIES)</text>
    <text x="1172" y="32" font-size="11.5" fill="#d5b8bd" text-anchor="end">Pure fetch / parse / normalize — no state, scheduling, or persistence</text>
    <line x1="28" y1="42" x2="1172" y2="42" stroke="#ffffff" stroke-opacity="0.10"/>
    <g transform="translate(28 50)">
      <rect width="277" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="17" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af">@xbbg/xnews</text>
      <text x="14" y="32" font-size="10.8" fill="#d5b8bd">Full fetch / parse / normalize toolkit</text>
    </g>
    <g transform="translate(317 50)">
      <rect width="277" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="17" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af">@xbbg/xnews/catalog</text>
      <text x="14" y="32" font-size="10.8" fill="#d5b8bd">Network-free URL builders &amp; PROVIDER_POLICIES</text>
    </g>
    <g transform="translate(606 50)">
      <rect width="277" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="17" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af">@xbbg/xnews/parsers</text>
      <text x="14" y="32" font-size="10.8" fill="#d5b8bd">Pure RSS/Atom, CSV, XLSX, ZIP &amp; date parsers</text>
    </g>
    <g transform="translate(895 50)">
      <rect width="277" height="40" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="17" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af">@xbbg/xnews/asr</text>
      <text x="14" y="32" font-size="10.8" fill="#d5b8bd">Moonshine &amp; OpenRouter realtime transcription</text>
    </g>
    <g transform="translate(28 102)">
      <rect width="277" height="142" rx="14" fill="#291319" stroke="#fda4af" stroke-opacity="0.36"/>
      <text x="16" y="24" font-size="13.5" font-weight="800" fill="#ffffff">1. News &amp; Filings</text>
      <text x="16" y="41" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.2" fill="#fda4af">buildCompanyNewsFeed · buildTopicNewsFeed</text>
      <line x1="16" y1="49" x2="261" y2="49" stroke="#ffffff" stroke-opacity="0.08"/>
      <g transform="translate(16 0)">
        <circle cx="6" cy="62" r="2.2" fill="#fda4af"/>
        <text x="15" y="66" font-size="11" fill="#ffffff" fill-opacity="0.90">SEC EDGAR, Yahoo, Google News, Finviz</text>
        <circle cx="6" cy="82" r="2.2" fill="#fda4af"/>
        <text x="15" y="86" font-size="11" fill="#ffffff" fill-opacity="0.90">30+ fixed business &amp; market RSS/Atom feeds</text>
        <circle cx="6" cy="102" r="2.2" fill="#fda4af"/>
        <text x="15" y="106" font-size="11" fill="#ffffff" fill-opacity="0.90">Watchlist fan-out &amp; deduplicated NewsItem IDs</text>
        <circle cx="6" cy="122" r="2.2" fill="#fda4af"/>
        <text x="15" y="126" font-size="11" fill="#ffffff" fill-opacity="0.90">Per-provider status, warnings &amp; timings</text>
      </g>
    </g>
    <g transform="translate(317 102)">
      <rect width="277" height="142" rx="14" fill="#291319" stroke="#fda4af" stroke-opacity="0.36"/>
      <text x="16" y="24" font-size="13.5" font-weight="800" fill="#ffffff">2. Research &amp; Central Banks</text>
      <text x="16" y="41" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.2" fill="#fda4af">searchResearchPapers · CENTRAL_BANK_*</text>
      <line x1="16" y1="49" x2="261" y2="49" stroke="#ffffff" stroke-opacity="0.08"/>
      <g transform="translate(16 0)">
        <circle cx="6" cy="62" r="2.2" fill="#fda4af"/>
        <text x="15" y="66" font-size="11" fill="#ffffff" fill-opacity="0.90">arXiv, SSRN, NBER, OpenAlex, Semantic Scholar</text>
        <circle cx="6" cy="82" r="2.2" fill="#fda4af"/>
        <text x="15" y="86" font-size="11" fill="#ffffff" fill-opacity="0.90">PubMed, Crossref &amp; RePEc working papers</text>
        <circle cx="6" cy="102" r="2.2" fill="#fda4af"/>
        <text x="15" y="106" font-size="11" fill="#ffffff" fill-opacity="0.90">29 central-bank news &amp; speech feeds</text>
        <circle cx="6" cy="122" r="2.2" fill="#fda4af"/>
        <text x="15" y="126" font-size="11" fill="#ffffff" fill-opacity="0.90">13 central-bank research paper feeds</text>
      </g>
    </g>
    <g transform="translate(606 102)">
      <rect width="277" height="142" rx="14" fill="#291319" stroke="#fda4af" stroke-opacity="0.36"/>
      <text x="16" y="24" font-size="13.5" font-weight="800" fill="#ffffff">3. Economic &amp; World Data</text>
      <text x="16" y="41" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.2" fill="#fda4af">fetchDataRelease · createDataReleaseWatcher</text>
      <line x1="16" y1="49" x2="261" y2="49" stroke="#ffffff" stroke-opacity="0.08"/>
      <g transform="translate(16 0)">
        <circle cx="6" cy="62" r="2.2" fill="#fda4af"/>
        <text x="15" y="66" font-size="11" fill="#ffffff" fill-opacity="0.90">FRED, CFTC COT, DTCC swaps, HMDA, CRA</text>
        <circle cx="6" cy="82" r="2.2" fill="#fda4af"/>
        <text x="15" y="86" font-size="11" fill="#ffffff" fill-opacity="0.90">FFIEC Call Reports, FR Y-9, NIC, E.16, Census</text>
        <circle cx="6" cy="102" r="2.2" fill="#fda4af"/>
        <text x="15" y="106" font-size="11" fill="#ffffff" fill-opacity="0.90">Live market quotes &amp; prediction probabilities</text>
        <circle cx="6" cy="122" r="2.2" fill="#fda4af"/>
        <text x="15" y="126" font-size="11" fill="#ffffff" fill-opacity="0.90">Active events: OFAC, hazards, outages, WHO</text>
      </g>
    </g>
    <g transform="translate(895 102)">
      <rect width="277" height="142" rx="14" fill="#291319" stroke="#fda4af" stroke-opacity="0.36"/>
      <text x="16" y="24" font-size="13.5" font-weight="800" fill="#ffffff">4. Documents, Catalogs &amp; Media</text>
      <text x="16" y="41" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.2" fill="#fda4af">searchWorks · extractDocumentText · youtube</text>
      <line x1="16" y1="49" x2="261" y2="49" stroke="#ffffff" stroke-opacity="0.08"/>
      <g transform="translate(16 0)">
        <circle cx="6" cy="62" r="2.2" fill="#fda4af"/>
        <text x="15" y="66" font-size="11" fill="#ffffff" fill-opacity="0.90">Open Library, Internet Archive, LibGen, Anna&#x27;s</text>
        <circle cx="6" cy="82" r="2.2" fill="#fda4af"/>
        <text x="15" y="86" font-size="11" fill="#ffffff" fill-opacity="0.90">Zero-dep EPUB, PDF, DjVu, MOBI &amp; CBZ readers</text>
        <circle cx="6" cy="102" r="2.2" fill="#fda4af"/>
        <text x="15" y="106" font-size="11" fill="#ffffff" fill-opacity="0.90">YouTube channel feeds &amp; caption tracks</text>
        <circle cx="6" cy="122" r="2.2" fill="#fda4af"/>
        <text x="15" y="126" font-size="11" fill="#ffffff" fill-opacity="0.90">Earnings call transcripts &amp; realtime ASR</text>
      </g>
    </g>
  </g>

</svg>
